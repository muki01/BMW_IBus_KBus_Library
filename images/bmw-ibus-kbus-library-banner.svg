<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-labelledby="t d">
  <title id="t">BMW I-Bus / K-Bus library for Arduino, ESP32 and other microcontrollers</title>
  <desc id="d">Banner showing a decoded BMW K-Bus frame 50 04 68 32 11 1F (steering wheel volume up) with source, length, destination, command, data and XOR checksum bytes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <radialGradient id="amber" cx="78%" cy="28%" r="55%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue" cx="8%" cy="100%" r="55%">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".18"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="480" rx="22"/></clipPath>
  </defs>
    <style>
      .glow{animation:hit 6s linear infinite}.b0 .glow{animation-delay:0s}.b1 .glow{animation-delay:1s}.b2 .glow{animation-delay:2s}.b3 .glow{animation-delay:3s}.b4 .glow{animation-delay:4s}.b5 .glow{animation-delay:5s}
      .scan{animation:scan 6s linear infinite}
      .live{animation:blink 1.6s ease-in-out infinite}
      @keyframes hit{0%{opacity:0}3%{opacity:1}16%{opacity:1}24%{opacity:0}100%{opacity:0}}
      @keyframes scan{from{transform:translateX(0)}to{transform:translateX(478px)}}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
      @media (prefers-reduced-motion:reduce){.glow,.scan,.live{animation:none}.scan{opacity:0}}
    </style>

  <g clip-path="url(#card)">
    <rect width="1280" height="480" fill="url(#bg)"/>
    <rect width="1280" height="480" fill="url(#grid)"/>
    <rect width="1280" height="480" fill="url(#amber)"/>
    <rect width="1280" height="480" fill="url(#blue)"/>

    <!-- left column -->
    <text x="64" y="77" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="18" letter-spacing="2.9" fill="#22d3ee">OPEN-SOURCE LIBRARY</text>
    <text x="60" y="144" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="70" font-weight="800" letter-spacing="-1.8" fill="#f8fafc">BMW I/K-Bus</text>
    <text x="60" y="218" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="70" font-weight="800" letter-spacing="-1.8" fill="url(#title)">Library</text>
    <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" fill="#cbd5e1">
      <tspan x="64" y="272">Read, decode and send I-Bus &amp; K-Bus messages</tspan>
      <tspan x="64" y="310">on classic BMWs from your own sketch.</tspan>
    </text>
    <rect x="64" y="338" width="119" height="34" rx="17" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="123.5" y="360.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16.5" fill="#cbd5e1">9600 baud</text>
    <rect x="191" y="338" width="58" height="34" rx="17" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="220" y="360.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16.5" fill="#cbd5e1">8E1</text>
    <rect x="257" y="338" width="139" height="34" rx="17" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="326.5" y="360.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16.5" fill="#cbd5e1">single wire</text>
    <rect x="404" y="338" width="69" height="34" rx="17" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/>
    <text x="438.5" y="360.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16.5" fill="#cbd5e1">12 V</text>
    <text x="64" y="413" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#8a97ab">E31 · E38 · E39 · E46 · E52 · E53 · E83 · E85 · E87</text>

    <!-- right column: analyzer panel -->
    <g transform="translate(664 62)">
      <rect x=".5" y=".5" width="551" height="355" rx="20" fill="#0a101c" fill-opacity=".72" stroke="#ffffff" stroke-opacity=".10"/>
      <circle class="live" cx="29" cy="30" r="5" fill="#34d399"/>
      <text x="44" y="35" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" letter-spacing="1.5" fill="#94a3b8">K-BUS  LIVE</text>
      <text x="528" y="35" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#64748b">9600 8E1</text>
      <path d="M0 56H552" stroke="#ffffff" stroke-opacity=".08"/>
      <path d="M24.0 72.0H38.2V140.0H45.4H52.7H59.9H67.1H74.3V72.0H81.4V140.0H88.6V72.0H95.8V140.0H103.1H110.3V72.0H117.5V140.0H124.7H131.9H139.1V72.0H146.3V140.0H153.6H160.7H167.9H175.1H182.3V72.0H189.5H196.7V140.0H204.0H211.2H218.4H225.6V72.0H232.8V140.0H239.9V72.0H247.1H254.4V140.0H261.6V72.0H268.8H276.0V140.0H283.2H290.4V72.0H297.6V140.0H304.9H312.1V72.0H319.2H326.4V140.0H333.6H340.8V72.0H348.0H355.3V140.0H362.5V72.0H369.7V140.0H376.9H384.1H391.3V72.0H398.4V140.0H405.7H412.9H420.1H427.3V72.0H434.5V140.0H441.7V72.0H448.9H456.2H463.4H470.6H477.7V140.0H484.9H492.1H499.3V72.0H506.6H513.8H528.0" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linejoin="round"/>
      <rect class="scan" x="37" y="64" width="2" height="84" fill="#cffafe" opacity=".85"/>
      <g class="byte b0"><rect x="24" y="164" width="74" height="88" rx="12" fill="#22d3ee" fill-opacity=".10" stroke="#22d3ee" stroke-opacity=".55" stroke-width="1.5"/><rect class="glow" x="24" y="164" width="74" height="88" rx="12" fill="#22d3ee" fill-opacity=".22" stroke="#22d3ee" stroke-width="2" opacity="0"/><text x="61" y="220" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="34" font-weight="700" fill="#f8fafc">50</text><text x="61" y="278" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="1.2" fill="#22d3ee">SRC</text></g>
      <g class="byte b1"><rect x="110" y="164" width="74" height="88" rx="12" fill="#94a3b8" fill-opacity=".10" stroke="#94a3b8" stroke-opacity=".55" stroke-width="1.5"/><rect class="glow" x="110" y="164" width="74" height="88" rx="12" fill="#94a3b8" fill-opacity=".22" stroke="#94a3b8" stroke-width="2" opacity="0"/><text x="147" y="220" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="34" font-weight="700" fill="#f8fafc">04</text><text x="147" y="278" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="1.2" fill="#94a3b8">LEN</text></g>
      <g class="byte b2"><rect x="196" y="164" width="74" height="88" rx="12" fill="#34d399" fill-opacity=".10" stroke="#34d399" stroke-opacity=".55" stroke-width="1.5"/><rect class="glow" x="196" y="164" width="74" height="88" rx="12" fill="#34d399" fill-opacity=".22" stroke="#34d399" stroke-width="2" opacity="0"/><text x="233" y="220" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="34" font-weight="700" fill="#f8fafc">68</text><text x="233" y="278" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="1.2" fill="#34d399">DST</text></g>
      <g class="byte b3"><rect x="282" y="164" width="74" height="88" rx="12" fill="#818cf8" fill-opacity=".10" stroke="#818cf8" stroke-opacity=".55" stroke-width="1.5"/><rect class="glow" x="282" y="164" width="74" height="88" rx="12" fill="#818cf8" fill-opacity=".22" stroke="#818cf8" stroke-width="2" opacity="0"/><text x="319" y="220" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="34" font-weight="700" fill="#f8fafc">32</text><text x="319" y="278" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="1.2" fill="#818cf8">CMD</text></g>
      <g class="byte b4"><rect x="368" y="164" width="74" height="88" rx="12" fill="#c084fc" fill-opacity=".10" stroke="#c084fc" stroke-opacity=".55" stroke-width="1.5"/><rect class="glow" x="368" y="164" width="74" height="88" rx="12" fill="#c084fc" fill-opacity=".22" stroke="#c084fc" stroke-width="2" opacity="0"/><text x="405" y="220" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="34" font-weight="700" fill="#f8fafc">11</text><text x="405" y="278" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="1.2" fill="#c084fc">DATA</text></g>
      <g class="byte b5"><rect x="454" y="164" width="74" height="88" rx="12" fill="#f472b6" fill-opacity=".10" stroke="#f472b6" stroke-opacity=".55" stroke-width="1.5"/><rect class="glow" x="454" y="164" width="74" height="88" rx="12" fill="#f472b6" fill-opacity=".22" stroke="#f472b6" stroke-width="2" opacity="0"/><text x="491" y="220" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="34" font-weight="700" fill="#f8fafc">1F</text><text x="491" y="278" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" letter-spacing="1.2" fill="#f472b6">XOR</text></g>
      <path d="M0 298H552" stroke="#ffffff" stroke-opacity=".08"/>
      <text x="24" y="334" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#e2e8f0">MFL <tspan fill="#64748b">&#8594;</tspan> RAD <tspan fill="#64748b">·</tspan> <tspan fill="#67e8f9">Volume Up</tspan></text>
      <text x="528" y="334" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#34d399">checksum OK</text>
    </g>
  </g>
</svg>
