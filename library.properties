sentence=BMW I-Bus / K-Bus library: read, decode and send messages on classic BMWs.
paragraph=Talks to the BMW I-Bus and K-Bus (IBus / KBus) of the E46, E39, E38, E53, E83, E85 and other classic BMWs. Receives and validates messages, calculates checksums, waits for an idle bus before transmitting and can put the transceiver to sleep. Use it to sniff bus traffic or to control lights, windows, locks and radio. Tested in a BMW E46 with the Arduino Nano and the ESP32; other boards are supported experimentally.
